# Optional edge reverse proxy for HTTPS termination in front of `web` + `api`.
# Use with docker compose profile `edge` or as a host nginx include.

upstream insurtech_web {
    server web:80;
}

upstream insurtech_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when certificates are mounted (uncomment in production)
    # return 301 https://$host$request_uri;

    location /health {
        proxy_pass http://insurtech_api/health;
    }

    location /ready {
        proxy_pass http://insurtech_api/ready;
    }

    location /api/ {
        proxy_pass http://insurtech_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://insurtech_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

